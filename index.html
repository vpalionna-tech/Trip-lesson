<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ultimate Weekend Trip: розмовний квест (120 хв, A2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F5FB; --surface:#FFFFFF; --ink:#16192E; --muted:#58607F; --line:#D3D9EE; --soft:#E8ECF9;
  --acc:#2F5BFF; --onacc:#FFFFFF; --gold:#FFC83D; --ok:#1E8A55; --oksoft:#D8F4E5; --warn:#FFEBB5; --bad:#FFE0DC; --focus:#0A5CFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E1220; --surface:#171C30; --ink:#EEF1FF; --muted:#AEB6D8; --line:#2F3860; --soft:#212845; --acc:#7C9BFF; --onacc:#0E1220; --gold:#FFC83D; --ok:#6FE0A0; --oksoft:#17402E; --warn:#4A3D12; --bad:#4D2420; --focus:#9CC1FF; }
}
:root[data-theme="dark"]{ --bg:#0E1220; --surface:#171C30; --ink:#EEF1FF; --muted:#AEB6D8; --line:#2F3860; --soft:#212845; --acc:#7C9BFF; --onacc:#0E1220; --gold:#FFC83D; --ok:#6FE0A0; --oksoft:#17402E; --warn:#4A3D12; --bad:#4D2420; --focus:#9CC1FF; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;font-size:17px;line-height:1.55}
button,input,textarea{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

.top{background:var(--surface);border-bottom:2px solid var(--line)}
.top-in{max-width:1000px;margin:0 auto;padding:12px 14px 10px}
.r1{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{margin:0;font-size:clamp(19px,4.4vw,27px);font-weight:800;line-height:1.15}
.top h1 em{font-style:normal;background:var(--gold);color:#16192E;border-radius:8px;padding:0 8px}
.timer{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.clock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:100px;text-align:center;border:2px solid var(--line);border-radius:12px;padding:0 10px;background:var(--soft)}
.clock.off{opacity:.4}
.tb{cursor:pointer;font-weight:700;font-size:14px;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface);color:var(--ink)}
.tb.main{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.stages{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.sg{cursor:pointer;text-align:left;border:2px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--surface);font-weight:700;font-size:12.5px;line-height:1.2;display:flex;flex-direction:column;gap:1px}
.sg small{font-weight:600;color:var(--muted);font-size:11.5px}
.sg[aria-current="true"]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.sg[aria-current="true"] small{color:var(--onacc);opacity:.9}
.sg.done{border-color:var(--ok);background:var(--oksoft)}
.sg.done[aria-current="true"]{background:var(--acc);border-color:var(--acc)}
.xp{display:flex;align-items:center;gap:10px;margin-top:10px}
.xpbar{flex:1;height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.xpbar>i{display:block;height:100%;background:var(--gold);transition:width .3s}
.xpn{font-weight:800;font-size:14px;white-space:nowrap}
.main{max-width:1000px;margin:0 auto;padding:16px 14px 110px}

.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 16px}
h2{font-size:24px;margin:0 0 4px;font-weight:800}
h3{font-size:16px;margin:16px 0 6px;font-weight:800}
.muted{color:var(--muted);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.btn{cursor:pointer;font-weight:700;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:9px 16px;background:var(--surface);color:var(--ink)}
.btn.main{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn.gold{background:var(--gold);color:#16192E;border-color:#16192E}
.btn.good{background:var(--oksoft);border-color:var(--ok)}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tip{border-left:6px solid var(--acc);background:var(--soft);border-radius:8px;padding:8px 12px;margin:10px 0}
.warn{border-left:6px solid #E8B000;background:var(--warn);border-radius:8px;padding:8px 12px;margin:10px 0}
.okb{border-left:6px solid var(--ok);background:var(--oksoft);border-radius:8px;padding:8px 12px;margin:10px 0}
.twist{border:3px dashed #E8B000;background:var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{cursor:pointer;font-weight:700;font-size:15px;border:2px solid var(--acc);border-radius:999px;padding:3px 14px;background:var(--surface);color:var(--ink)}
.chip.sel{background:var(--acc);color:var(--onacc)}
.chip.plain{border-color:var(--line);cursor:default}
.tag{display:inline-block;font-weight:800;font-size:12px;border-radius:999px;padding:1px 10px;background:var(--gold);color:#16192E;margin-right:6px}
.big{font-size:clamp(20px,4.6vw,28px);font-weight:800;line-height:1.3;margin:8px 0}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.opt{cursor:pointer;text-align:center;font-weight:800;font-size:18px;border:2px solid var(--line);border-radius:14px;padding:14px 8px;background:var(--surface);color:var(--ink);line-height:1.25}
.opt.pick{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.opt.good{background:var(--oksoft);border-color:var(--ok)}
.opt.soft{background:var(--warn);border-color:#E8B000}
.opt[disabled]{cursor:default}
.list1{display:grid;gap:8px}
.list1 .opt{text-align:left;font-size:16.5px;font-weight:700;padding:10px 14px}
.dots{display:flex;gap:6px;margin:0 0 8px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.dot.on{background:var(--acc);border-color:var(--acc)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.vibes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.timerbox{margin:10px 0 4px}
.tnum{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.tbar{height:10px;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);margin-top:6px}
.tbar>i{display:block;height:100%;background:var(--acc);width:100%}
.tmsg{margin:4px 0 0;color:var(--muted);font-size:14px}

/* reading */
.page{border:2px solid var(--line);border-radius:16px;background:var(--bg);padding:12px 14px;margin:10px 0}
.page .hd{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:6px}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--acc);color:var(--onacc);font-weight:800}
.page p{margin:6px 0;font-size:17.5px}
.hl{cursor:pointer;font-weight:800;border:0;border-bottom:3px solid var(--gold);background:transparent;padding:0 1px;font-size:inherit;color:inherit}
.hl:hover{background:var(--soft)}
.tipbox{position:sticky;bottom:10px;border:3px solid var(--acc);border-radius:16px;background:var(--surface);padding:10px 14px;margin:10px 0;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:5}
.tipbox .w{font-size:22px;font-weight:800}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt .col{display:grid;gap:8px}
.mt .opt{text-align:left;font-size:16px;font-weight:700;padding:9px 12px}
.mt .opt.sel{background:var(--acc);color:var(--onacc)}
.mt .opt.done{background:var(--oksoft);border-color:var(--ok)}

/* budget */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:10px 0}
.item{cursor:pointer;text-align:left;border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:2px;line-height:1.25}
.item .em{font-size:30px;line-height:1}
.item b{font-size:15px}
.item .u{color:var(--muted);font-size:13px}
.item .p{font-weight:800}
.item .rec{font-size:12px;font-weight:800;color:#8A5B00}
.item[aria-pressed="true"]{background:var(--oksoft);border-color:var(--ok)}
.meter{height:20px;border:2px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden;margin:6px 0}
.meter>i{display:block;height:100%;background:var(--ok);transition:width .3s}
.meter.warn>i{background:#E8B000}
.lay{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.cart{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}
.just{border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0;background:var(--surface)}
.just.ok{background:var(--oksoft);border-color:var(--ok)}

/* roleplay */
.chars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.char{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
.char b{display:block}
.step{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;background:var(--surface)}
.step .t{display:flex;gap:10px;align-items:flex-start}
.step .t b{color:var(--acc);min-width:64px}
.hnt{margin-top:8px;padding:8px 12px;border-left:6px solid var(--acc);background:var(--soft);border-radius:8px;font-size:15.5px}
.hnt div{margin:2px 0}

/* compare */
.tabsb{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dest{border:2px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.dest.fav{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.dest .h{padding:8px 12px;font-weight:800;background:var(--soft);border-bottom:2px solid var(--line)}
.dest .b{padding:10px 12px}
.w3{display:grid;gap:8px;margin:8px 0}
.w3 .r{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--surface)}
.star{cursor:pointer;font-size:24px;border:0;background:transparent;padding:0 2px;filter:grayscale(1);opacity:.5}
.star.on{filter:none;opacity:1}
.sc{display:grid;grid-template-columns:130px 1fr 40px;gap:8px;align-items:center;margin:6px 0}
.sc .b{height:14px;background:var(--soft);border-radius:999px;overflow:hidden}
.sc .b>i{display:block;height:100%;background:var(--acc)}

/* wrap */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.kpi div{border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;background:var(--surface)}
.kpi .n{font-size:30px;font-weight:800;line-height:1}
.kpi small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.bdg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.bd{border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;background:var(--surface);font-size:13px}
.bd .e{font-size:28px;display:block;filter:grayscale(1);opacity:.4}
.bd.on{background:var(--gold);color:#16192E}
.bd.on .e{filter:none;opacity:1}
.wds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wds label{display:flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--surface);font-size:14.5px;cursor:pointer}
.wds label.on{background:var(--oksoft);border-color:var(--ok)}
.wds input{width:17px;height:17px}
.ta{width:100%;min-height:70px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);font-size:16px;margin:4px 0}
.sum{white-space:pre-wrap;background:var(--bg);border:2px dashed var(--line);border-radius:12px;padding:12px;font-size:15px}

/* rescue */
.sos{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;cursor:pointer;font-weight:800;font-size:16px;border:3px solid var(--gold);border-radius:999px;padding:10px 18px;background:var(--warn);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);z-index:40;background:var(--surface);border-left:3px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto;transform:translateX(105%);transition:transform .25s}
.drawer.open{transform:none}
.veil{position:fixed;inset:0;background:rgba(5,8,20,.5);z-index:35;display:none}
.veil.open{display:block}
.ph{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;background:var(--bg)}
.ph .e{font-weight:800;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 18px;font-weight:700;font-size:15px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}

@media (max-width:820px){
  body{font-size:16.5px}
  .stages{grid-template-columns:repeat(7,1fr)}
  .sg small{display:none}
  .sg{padding:6px 4px;font-size:11px;text-align:center;align-items:center}
  .lay{grid-template-columns:1fr}
  .cmp{grid-template-columns:1fr}
  .chars,.mt{grid-template-columns:1fr}
  .vibes{grid-template-columns:1fr}
  .bdg{grid-template-columns:repeat(2,1fr)}
  .wds{grid-template-columns:1fr 1fr}
  .sc{grid-template-columns:90px 1fr 34px}
}
@media (prefers-reduced-motion: reduce){ .btn:active{transform:none} .xpbar>i,.meter>i,.toast,.drawer{transition:none} }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="r1">
    <h1>✈️ Ultimate <em>Weekend Trip</em></h1>
    <div class="timer" aria-label="Таймер уроку">
      <span class="clock" id="clock" role="timer">120:00</span>
      <button class="tb main" id="tpause">▶ Старт</button>
      <button class="tb" id="tplus">+5 хв</button>
      <button class="tb" id="ttog">👁 Сховати</button>
      <button class="tb" id="tth" aria-label="Тема">🌓</button>
    </div>
  </div>
  <nav class="stages" id="stages" aria-label="Етапи уроку"></nav>
  <div class="xp"><div class="xpbar" aria-hidden="true"><i id="xpi" style="width:0%"></i></div><span class="xpn" id="xpn">0 XP</span></div>
</div></header>
<main class="main" id="view"></main>
<button class="sos" id="sosBtn" aria-haspopup="dialog">🆘 Фрази порятунку</button>
<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Фрази порятунку" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
var $=function(s){ return document.querySelector(s); };
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
var canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
function say(t){ if(!canSpeak){ toast('Озвучка недоступна у цьому браузері. Прочитайте вголос самостійно.'); return; } try{ window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=0.88; window.speechSynthesis.speak(u);}catch(e){ toast('Озвучка не спрацювала. Прочитайте вголос.'); } }
var toastT=null; function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },2400); }
function copyText(txt,msg){ try{ navigator.clipboard.writeText(txt).then(function(){ toast(msg||'Скопійовано ✓'); },function(){ fb(txt,msg); }); }catch(e){ fb(txt,msg); } }
function fb(txt,msg){ var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast(msg||'Скопійовано ✓'); }catch(e){ toast('Виділіть текст і скопіюйте вручну.'); } document.body.removeChild(ta); }
function bindA(attr,fn){ var c=document.querySelectorAll('['+attr+']'); for(var i=0;i<c.length;i++) c[i].onclick=function(){ fn(this.getAttribute(attr)); }; }
function chipsH(list,attr){ return '<div class="chips">'+list.map(function(x,i){ return '<button class="chip" '+attr+'="'+i+'">'+esc(x)+'</button>'; }).join('')+'</div>'; }
function bindChips(attr,list){ var c=document.querySelectorAll('['+attr+']'); for(var i=0;i<c.length;i++) c[i].onclick=function(){ var t=list[parseInt(this.getAttribute(attr),10)]; this.classList.toggle('sel'); copyText(t,'Скопійовано: «'+t+'»'); say(t.replace(/\.\.\./g,'')); }; }
function mkH(s){ return s.split(/(\[\[\w+\|[^\]]+\]\])/).map(function(p){ var m=p.match(/^\[\[(\w+)\|([^\]]+)\]\]$/); return m?'<button class="hl" data-gl="'+m[1]+'">'+esc(m[2])+'</button>':esc(p); }).join(''); }

/* ---------- state ---------- */
var S={stage:0,done:[0,0,0,0,0,0,0],xp:{},vibe:'',
 s1:{mode:'tt',i:0,ch:{},tt:{},tr:{},rc:{}},
 s2:{tab:0,tip:null,match:{},quiz:{},quizDone:false,mDone:false},
 s3:{cart:{},just:{},fin:false},
 s4:{mode:'taboo',tab:{},tn:0,mys:{clues:1,solved:{},oi:0}},
 s5:{sc:0,lvl:'easy',done:{},twists:0,path:{},ts:{}},
 s6:{tab:0,w:{},fav:'',ctr:{},fin:false},
 s7:{words:{},ref:['','',''],done:false}};
var KEY='weekendtrip.quest.v1';
try{ var sv=window.localStorage.getItem(KEY); if(sv){ var o=JSON.parse(sv); for(var k in o) if(k in S) S[k]=o[k]; } }catch(e){}
function save(){ try{ window.localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function award(key,n){ if(!S.xp[key]){ S.xp[key]=n; save(); drawXp(); toast('+'+n+' XP'); return true; } return false; }
function totalXp(){ var t=0; for(var k in S.xp) t+=S.xp[k]; return t; }
var MAXXP=900;
function drawXp(){ var t=totalXp(); $('#xpn').textContent=t+' XP'; $('#xpi').style.width=Math.min(100,Math.round(t/MAXXP*100))+'%'; }

/* ---------- theme ---------- */
$('#tth').onclick=function(){ var r=document.documentElement, cur=r.getAttribute('data-theme'); var dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches; r.setAttribute('data-theme',dark?'light':'dark'); };

/* ---------- timer ---------- */
var secs=7200, running=false, hideClock=false;
function drawClock(){ var m=Math.floor(Math.max(secs,0)/60), s=Math.max(secs,0)%60; $('#clock').textContent=hideClock?'•••:••':((m<100?(m<10?'00':'0'):'')+m).slice(-3)+':'+(s<10?'0':'')+s; $('#clock').classList.toggle('off',hideClock); $('#tpause').textContent=running?'⏸ Пауза':(secs<7200?'▶ Продовжити':'▶ Старт'); }
setInterval(function(){ if(!running) return; if(secs>0){ secs--; drawClock(); if(secs===0){ running=false; drawClock(); toast('Час уроку закінчився 🎉 Заверш підсумок.'); } } },1000);
$('#tpause').onclick=function(){ running=!running; drawClock(); };
$('#tplus').onclick=function(){ secs+=300; drawClock(); toast('Додано 5 хвилин'); };
$('#ttog').onclick=function(){ hideClock=!hideClock; this.textContent=hideClock?'👁 Показати':'👁 Сховати'; drawClock(); };

/* mini timers inside stages */
var mtid=null, mLeft=0, mTot=0;
function stopM(){ if(mtid){ clearInterval(mtid); mtid=null; } }
function fm(n){ var m=Math.floor(n/60), s=n%60; return m+':'+(s<10?'0':'')+s; }
function miniTimer(sec){ return '<div class="timerbox"><div class="tnum" id="mn" role="timer">'+fm(sec)+'</div><div class="tbar" aria-hidden="true"><i id="mb"></i></div><p class="tmsg" id="mm">Натисни «Старт», коли будеш готова. Короткі відповіді — це нормально.</p></div>'; }
